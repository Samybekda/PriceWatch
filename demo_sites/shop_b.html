<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ShopB - Tech Mania</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fafafa; margin: 0; padding: 20px; }
        header { background: #dc2626; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
        .product-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-width: 400px; margin-bottom: 15px; }
        .item-name { font-size: 1.3rem; font-weight: 600; }
        .tag { background: #fee2e2; color: #991b1b; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; display: inline-block; }
        .price-box { margin-top: 15px; }
        .price-value { font-size: 2rem; color: #b91c1c; font-weight: 700; }
        .currency { font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <h1>ShopB - Tech Mania</h1>
        <p>Prix cassés sur les grandes marques</p>
    </header>

    <div class="product-box" id="sony-wh1000xm5">
        <span class="tag">Promo Flash</span>
        <h2 class="item-name">Sony WH-1000XM5</h2>
        <div class="price-box">
            <span class="price-value">279,00</span>
            <span class="currency">€</span>
        </div>
        <p>Casque arceau Bluetooth avec réduction de bruit active.</p>
    </div>

    <div class="product-box" id="iphone-15">
        <h2 class="item-name">iPhone 15 128Go</h2>
        <div class="price-box">
            <span class="price-value">829,00</span>
            <span class="currency">€</span>
        </div>
        <p>Le tout dernier smartphone d'Apple.</p>
    </div>
</body>
</html>
