<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ShopC - HighTech Express</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
        header { background: #0f172a; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
        .item-card { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; max-width: 400px; margin-bottom: 15px; }
        .title { font-size: 1.2rem; font-weight: bold; color: #1e293b; }
        .pricing { margin: 15px 0; }
        .amount { font-size: 1.8rem; font-weight: 800; color: #0284c7; }
    </style>
</head>
<body>
    <header>
        <h1>ShopC - HighTech Express</h1>
        <p>L'expertise technologique au juste prix</p>
    </header>

    <div class="item-card" data-product="sony-wh1000xm5">
        <div class="title">Sony WH-1000XM5</div>
        <div class="pricing">
            <span class="amount" id="current-price">289.00 €</span>
        </div>
        <p>Qualité sonore haute résolution et confort exceptionnel.</p>
    </div>

    <div class="item-card" data-product="iphone-15">
        <div class="title">iPhone 15 128Go</div>
        <div class="pricing">
            <span class="amount">839.00 €</span>
        </div>
        <p>Appareil photo 48 Mpx et connecteur USB-C.</p>
    </div>
</body>
</html>
