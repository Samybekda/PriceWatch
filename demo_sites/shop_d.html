<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ShopD - Toulouse Tech</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2ff; margin: 0; padding: 25px; }
        header { background: #4338ca; color: white; padding: 20px 25px; border-radius: 10px; margin-bottom: 25px; }
        .product-card { background: white; border: 2px solid #c7d2fe; border-radius: 10px; padding: 20px; max-width: 420px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .product-title { font-size: 1.3rem; font-weight: bold; color: #1e1b4b; }
        .promo-badge { background: #16a34a; color: white; padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin: 8px 0; }
        .price { font-size: 2.2rem; font-weight: 800; color: #4338ca; }
    </style>
</head>
<body>
    <header>
        <h1>ShopD - Toulouse Tech</h1>
        <p>Boutique étudiante - Bons plans multimédia</p>
    </header>

    <div class="product-card" id="sony-wh1000xm5">
        <div class="product-title">Sony WH-1000XM5</div>
        <span class="promo-badge">Super Promo Étudiante</span>
        <div class="price-container">
            <span class="price">239.00 €</span>
        </div>
        <p>Casque sans fil réducteur de bruit Sony - Prix cassé spécial rentrée !</p>
    </div>

    <div class="product-card" id="macbook-air">
        <div class="product-title">MacBook Air M2</div>
        <span class="promo-badge">Offre Flash</span>
        <div class="price-container">
            <span class="price">1099.00 €</span>
        </div>
        <p>Ordinateur portable Apple ultra-léger et puissant.</p>
    </div>
</body>
</html>
