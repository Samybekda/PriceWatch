<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ShopA - Électro Discount</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        header { background: #2563eb; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; }
        .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; max-width: 400px; margin-bottom: 15px; }
        .product-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; }
        .price-container { margin: 15px 0; }
        .price { font-size: 1.75rem; color: #16a34a; font-weight: bold; }
        .stock { color: #475569; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>ShopA - Électro Discount</h1>
        <p>Le spécialiste du multimédia au meilleur prix</p>
    </header>

    <div class="product-card" id="sony-wh1000xm5">
        <div class="product-title">Sony WH-1000XM5</div>
        <div class="stock">En stock - Livraison 24h</div>
        <div class="price-container">
            <span class="price">299.00 €</span>
        </div>
        <p>Casque Bluetooth à réduction de bruit sans fil premium.</p>
    </div>

    <div class="product-card" id="iphone-15">
        <div class="product-title">iPhone 15 128Go</div>
        <div class="stock">En stock</div>
        <div class="price-container">
            <span class="price">849.00 €</span>
        </div>
        <p>Smartphone Apple avec puce A16 Bionic.</p>
    </div>
</body>
</html>
